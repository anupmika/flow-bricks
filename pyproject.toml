[project]
name = "flow-bricks"
version = "0.1.0"
description = "An app to manage Databricks workflows and pipelines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk",
    "databricks-connect",
    "openpyxl",
    "python-dotenv",
    "streamlit",
    "xlrd",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
data_file = "coverage/.coverage"
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
